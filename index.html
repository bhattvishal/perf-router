<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plan, wire and auto-route components on double-sided perfboard, with Wokwi diagram.json import.">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Perfboard Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: workbench — parts drawer | board | inspector; stacks to board → drawer → inspector on phones */
:root{
  --bg:#e8ede9; --panel:#ffffff; --panel-2:#f3f6f4; --ink:#152019; --muted:#56665d; --line:#d0d9d3;
  --accent:#b25a24; --accent-ink:#ffffff; --accent-soft:#f6e6da;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#9a6512; --warn-soft:#f8ecd6; --bad:#c0352d; --bad-soft:#fbe3e1;
  /* the board and parts are physical objects: same colours in both themes */
  --fr4:#2b6744; --fr4-edge:#1f4f33; --ring:#c9ced2; --drill:#10201a; --pin:#d6ad48; --pin-edge:#9c7a24;
  --mcu:#1d2b4a; --mcu-edge:#0f1830; --silk:#eef3f6; --usb:#b9bec4; --usb-edge:#7d848b;
  --housing:#f1ead9; --housing-edge:#b9ab8a; --housing-ink:#4a3f2a;
  --lead:#aeb4b9; --res:#d8c095; --res-edge:#a88d5c; --band-a:#6b3d1c; --band-b:#1b1b1b; --band-c:#c23a2a; --band-d:#c9a23a; --dio-band:#c9ccd1;
  --led-red-dk:#9e1d14; --led-green-dk:#11702e; --led-blue-dk:#183f9e;
  --led:#e2483d; --led-edge:#9e2219; --px:#f4f4ef; --px-edge:#a9aaa3; --px-ink:#3a3b37; --pcb:#121614;
  --rat-under:#0b1a12; --src:#ffffff; --scrim:rgba(14,22,17,.45); --shadow:rgba(10,20,14,.25);
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --panel:#171e1a; --panel-2:#1d2520; --ink:#e2e9e4; --muted:#8e9c94; --line:#2b3530;
    --accent:#e08a50; --accent-ink:#1a0f07; --accent-soft:#3a2516;
    --ok:#6fcf97; --ok-soft:#173223; --warn:#e7b25c; --warn-soft:#3a2c14; --bad:#f07a71; --bad-soft:#3d1a18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --panel:#171e1a; --panel-2:#1d2520; --ink:#e2e9e4; --muted:#8e9c94; --line:#2b3530;
  --accent:#e08a50; --accent-ink:#1a0f07; --accent-soft:#3a2516;
  --ok:#6fcf97; --ok-soft:#173223; --warn:#e7b25c; --warn-soft:#3a2c14; --bad:#f07a71; --bad-soft:#3d1a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
/* one screen, no page scroll: each panel scrolls on its own */
.app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;row-gap:10px;column-gap:0;padding:10px 12px;
  grid-template-rows:auto minmax(0,1fr);grid-template-columns:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top top top top top" "pal sl board sr right"}
.pal{width:var(--palW,236px)}
.rightp{width:var(--rightW,340px)}
.app.pal-off .pal,.app.right-off .rightp,.app.pal-off .split.l,.app.right-off .split.r{display:none}
/* drag handles between the panels */
.split{width:12px;cursor:col-resize;position:relative;touch-action:none;align-self:stretch}
.split.l{grid-area:sl}.split.r{grid-area:sr}
.split::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:44px;margin:-22px 0 0 -2px;border-radius:3px;background:var(--line);transition:background .12s,height .12s}
.split:hover::after,.split.drag::after{background:var(--accent);height:72px;margin-top:-36px}
.split:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
body.resizing{cursor:col-resize;user-select:none}
.pal,.rightp{min-height:0;overflow:auto;overscroll-behavior:contain}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "board"}
  .split{display:none}
  .pal,.rightp{position:fixed;z-index:12;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));margin:0;box-shadow:0 14px 40px var(--shadow);width:min(340px,calc(100vw - 32px))}
  .pal{left:8px} .rightp{right:8px}
}

/* top bar */
@media (max-width:900px){.brand span{display:none}.brand h1{font-size:22px}.top{gap:8px 12px}}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font:700 26px/1 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.brand span{font:500 12px var(--mono);color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.margins input{width:60px!important}
.margins label{font:600 10px var(--mono);color:var(--muted)}
.field input{width:56px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:500 13px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.times{font-family:var(--mono);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.hist button{color:var(--ink);font-weight:600}
.seg.hist button:disabled{opacity:.4;cursor:not-allowed}
.seg.hist button+button{border-left:1px solid var(--line)}
.seg.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn kbd{font:500 10px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
button:focus-visible,input:focus-visible,textarea:focus-visible,.prow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.eyebrow{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}

/* parts drawer */
.pal{grid-area:pal;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pgroup{border-top:1px solid var(--line);padding-top:8px}
.pgroup>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 6px}
.pgroup>summary::-webkit-details-marker{display:none}
.pgroup>summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
.pgroup:not([open])>summary::after{transform:rotate(-45deg)}
.pgroup>summary .cnt{font:500 11px var(--mono);color:var(--muted);margin-left:auto}
.pal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pal-head h2{font:600 18px var(--display);margin:0}
.pal-head small{color:var(--muted);font-size:12px;margin-left:auto}
.pitems{display:grid;gap:6px}
@media (max-width:1040px){.pitems{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.pitem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:7px 9px;cursor:pointer}
.pitem:hover{border-color:var(--accent)}
.pitem svg{width:56px;height:42px;display:block}
.pitem svg text,.pitem svg .lbl{display:none}
.pitem svg .part{cursor:inherit}
.pitem b{display:block;font-weight:600;font-size:13px;line-height:1.25}
.pitem i{display:block;font-style:normal;font:400 11px var(--mono);color:var(--muted)}
.tag{font:600 10px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:4px}
.mini-body{fill:var(--panel);stroke:var(--muted);stroke-width:1}
.mini-pin{fill:var(--pin)}

/* board */
.boardp{grid-area:board;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.board-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px}
.bar-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.status{font:500 12px var(--mono);color:var(--muted);min-height:18px;min-width:0;overflow-wrap:anywhere;flex:1 1 220px}
.meter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meter b{color:var(--ink);font-weight:600}
.meter .sep{opacity:.5}
.zoom{display:flex;gap:6px;align-items:center}
.zoom output{font:500 12px var(--mono);color:var(--muted);width:42px;text-align:center}
.board-stage{position:relative;flex:1 1 auto;min-height:200px}
.board-wrap{position:absolute;inset:0;overflow:auto;display:flex;padding:6px 40px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);overscroll-behavior:contain}
.board-wrap.panning{cursor:grabbing}
.board-wrap.panning *{cursor:grabbing!important}
#board{display:block;flex:none;margin:auto;user-select:none;-webkit-user-select:none}
.wiremode .fr4{fill:#2E2929;stroke:#1c1919}
/* floating panel switches on the board edges */
.float{position:absolute;z-index:3;display:flex;flex-direction:column;gap:6px;top:10px}
.float.l{left:5px}.float.r{right:5px}
.fbtn{writing-mode:vertical-rl;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 5px;font:600 12px var(--body);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 10px var(--shadow);display:flex;align-items:center;gap:6px}
.float.l .fbtn{transform:rotate(180deg)}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn svg{width:14px;height:14px;flex:none}
.rightp{grid-area:right;padding:0;display:flex;flex-direction:column}
.rp-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.rp-head .seg button{padding:5px 10px}
.rp-body{padding:14px}
.rp-body .plan{padding:0}
.fr4{fill:var(--fr4);stroke:var(--fr4-edge);stroke-width:2}
.ring{fill:var(--ring)}
.drill{fill:var(--drill)}
.axis{font:500 9px var(--mono);fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.axis-row{text-anchor:end}
.dim line{stroke:var(--muted);stroke-width:1}
.dim path{fill:var(--muted)}
.dim-t{font:600 10px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central;white-space:pre}
.mguide line{stroke:#f4ecc8;stroke-width:1.3;stroke-dasharray:2 2.5}
.mguide-t{font:600 7.5px var(--mono);fill:#f4ecc8;text-anchor:middle;dominant-baseline:central}
.part{cursor:grab;touch-action:none}
.part.locked{cursor:pointer}
.wiremode .part,.wiremode{cursor:crosshair}
.b-mcu{fill:var(--mcu);stroke:var(--mcu-edge);stroke-width:1.5}
.b-usb{fill:var(--usb);stroke:var(--usb-edge);stroke-width:1.2}
.b-jst{fill:url(#gJst);stroke:var(--housing-edge);stroke-width:1.2}
.b-lead{stroke:var(--lead);stroke-width:2.4;stroke-linecap:round}
.b-res{stroke:rgba(80,60,30,.45);stroke-width:.8}
.b-led{stroke:rgba(0,0,0,.35);stroke-width:1}
.b-led-flange{stroke:rgba(0,0,0,.3);stroke-width:1}
.b-led-hi{fill:#fff;opacity:.55}
.b-flat{stroke:var(--led-edge);stroke-width:2.2}
.b-px{fill:url(#gDiff);stroke:var(--px-edge);stroke-width:1}
.b-px-fl{fill:#e6e6df;stroke:#b9b9b0;stroke-width:1}
.b-pcb{fill:var(--pcb);stroke:var(--pcb);stroke-width:1}
.pin{fill:var(--pin);stroke:var(--pin-edge);stroke-width:1}
.castle{stroke:#c9ced2;stroke-width:4.5;stroke-linecap:round}
.castle-tab{stroke:var(--pin);stroke-width:7;stroke-linecap:butt}
.castle-pad{fill:var(--pin);stroke:var(--pin-edge);stroke-width:1}
.b-mcu-btn{fill:#e4e6e8;stroke:#8a8f95;stroke-width:.8}
.b-mcu-chip,.b-chip{fill:url(#gChip);stroke:#2d3036;stroke-width:1}
.b-smd{fill:#c9a86a;stroke:#7a6332;stroke-width:.5}
.b-cap{fill:#d9b766;stroke:#8f7232;stroke-width:.6}
.b-sheen{fill:url(#gSheen);pointer-events:none}
.b-usb-in{fill:#4d5359}
.m-hole{fill:#d8d2bd}.m-hole-in{fill:#10201a}
.b-sensor{fill:#e9eef2;stroke:#9aa3ab;stroke-width:.6}.b-die{fill:#3c2a5e}
.b-lens{fill:#11141a;stroke:#3b4250;stroke-width:1.2}
.b-term{fill:#2f8f4e;stroke:#1d5e33;stroke-width:1}
.b-screw{fill:url(#gMetal);stroke:#6c737a;stroke-width:.8}.b-screw-slot{stroke:#4a5056;stroke-width:1.6}
.b-jst-in{fill:#d9cfb8;stroke:#b9ab8a;stroke-width:.6}.b-jst-rib{fill:#e7dfcb;stroke:#b9ab8a;stroke-width:.6}
.b-ws-die{fill:#f5d68a;stroke:#c7a24c;stroke-width:.5}.b-ws-notch{stroke:#9fa29c;stroke-width:1.4;fill:none}
.lead-under{fill:#cfd3d7;stroke:rgba(0,0,0,.45);stroke-width:.8;opacity:.9}
.sock{fill:#1a1c1f;stroke:#000;stroke-width:.6}.sock-in{fill:#050506}
.b-mcu-dot{fill:#5b6068}
.b-mcu-ant{fill:#e8e1cf;stroke:#a89f88;stroke-width:.8}
.b-mcu-led{fill:#ff5a4f}
.b-mcu-can,.b-can{fill:url(#gMetal);stroke:#8d939a;stroke-width:1}
.b-mcu-mod{fill:#15171a}
.b-mcu-zig{fill:none;stroke:#c9a23a;stroke-width:2}
.t-onmetal{fill:#2a2d31!important;opacity:1}
.b-buzz{fill:url(#gBuzz);stroke:#000;stroke-width:1.2}
.b-buzz-ring{fill:none;stroke:rgba(255,255,255,.08);stroke-width:2}
.b-seal{fill:#f2f0e8;opacity:.92}
.t-plus{font:700 14px var(--mono);fill:#e8e8e8;text-anchor:middle;dominant-baseline:central}
.b-buzz-hole{fill:#3b3f45}
.b-btn{fill:#202226;stroke:#0d0e10;stroke-width:1}
.b-metal{fill:url(#gMetal);stroke:#7d848b;stroke-width:.8}
.b-dot{fill:#121315}
.b-btn-cap{fill:url(#gCap);stroke:#0d0e10;stroke-width:1}
.b-sw{fill:#3a3f45;stroke:#0d0f12;stroke-width:1}
.b-sw-knob{fill:#1d1f22;stroke:#000;stroke-width:.8}
.b-mod{stroke:rgba(0,0,0,.45);stroke-width:1.2}
.b-fhdr{fill:#17191c;stroke:#000;stroke-width:1}
.b-dio{fill:#1d1f22;stroke:#000}
.b-dht{fill:#f4f5f1;stroke:#9ea3a0;stroke-width:1.2}
.b-dht-slot{fill:#c9ccc6}
.b-ws{fill:#f4f4f0;stroke:#9fa29c;stroke-width:1}
.b-ws-lens{fill:url(#gDiff);stroke:#d8d2b8;stroke-width:1}
.b-ws-pad{fill:var(--pin);stroke:var(--pin-edge);stroke-width:.6}
.lbl-smdled{fill:#33352f}
.t-ref{font:600 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:var(--silk)}
.t-name{font:500 9.5px var(--mono);text-anchor:middle;dominant-baseline:central;fill:var(--silk);opacity:.85}
.t-dark{fill:var(--housing-ink)}
.lbl{font:600 7.4px var(--mono);text-anchor:middle;dominant-baseline:central;fill:var(--silk)}
.lbl-px5{fill:var(--px-ink)}
.lock rect{fill:var(--pin)}
.lock path{fill:none;stroke:var(--pin);stroke-width:1.4}
.o-sel{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:5 3}
.o-bad{fill:var(--bad);fill-opacity:.28;stroke:var(--bad);stroke-width:2.2}
.solder .body{opacity:.22}
.solder .body .t-ref,.solder .body .t-name{opacity:1}
.solder .lbl{fill:var(--silk);paint-order:stroke;stroke:var(--fr4);stroke-width:2.5px}
#ratsLayer,#overlayLayer{pointer-events:none}
.rat-under{stroke:var(--rat-under);stroke-width:4;stroke-linecap:round;opacity:.55}
.rat{stroke-width:1.9;stroke-linecap:round}
.rat.hl{stroke-width:3}
.netring{fill:none;stroke-width:2.2}
.netring.hl{stroke-width:3}
.srcring{fill:none;stroke:var(--src);stroke-width:2.5;stroke-dasharray:4 3;animation:spin 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
.band{stroke:var(--src);stroke-width:1.8;stroke-dasharray:5 4;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.srcring{animation:none}}
.flipnote{position:absolute;bottom:8px;left:46px;font:600 11.5px var(--body);color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);border-radius:999px;padding:4px 12px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.flipnote.on{opacity:.95}
@media (prefers-reduced-motion:reduce){.flipnote{transition:none}}

/* selection bar */
.selbar{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:6px 10px;border:1px dashed var(--line);border-radius:10px;height:46px;flex:none;overflow:hidden}
.selbar .hint{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.selbar>.hint{flex:1 1 auto}
.selbar .who{display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.selbar .btn{flex:none}
.board-bar.info{flex-wrap:nowrap;height:20px;overflow:hidden;flex:none}
.board-bar.info .status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0}
.board-bar.info .meter{flex-wrap:nowrap;white-space:nowrap;flex:0 1 auto;overflow:hidden}
.selbar.wire{border-color:var(--accent);background:var(--accent-soft)}
.selbar .who{margin-right:auto;min-width:0}
.selbar .who b{font:700 18px var(--display);margin-right:6px}
.selbar .hint{color:var(--muted);font-size:13px}
.selbar.wire .hint{color:var(--ink)}

/* inspector */
.insp{display:grid;gap:14px}
.insp h2{font:700 30px/1 var(--display);margin:0;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.insp h3{font:600 16px var(--display);margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px var(--body);padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--muted);flex:none;vertical-align:-1px}
h2 .sw{width:18px;height:18px;border-radius:4px}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stepper{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.stepper .btn{padding:3px 10px}
.pins-wrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel-2);position:sticky;top:0}
td.h{font-family:var(--mono);font-weight:600;width:52px}
td.muted{color:var(--muted)}
tr:last-child td{border-bottom:0}
.netlink{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--ink);text-align:left}
.netlink:hover{text-decoration:underline}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0}
.plist{display:grid;gap:4px}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.prow:hover{border-color:var(--line)}
.prow b{font:600 13px var(--mono);display:flex;align-items:center;gap:6px;min-width:0}
.prow span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.net{grid-template-columns:minmax(0,1fr) auto auto}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--bad-soft);color:var(--bad);border:0;text-align:left;cursor:pointer;width:100%}
.issue.warn{background:var(--warn-soft);color:var(--warn)}
.issue b{font-family:var(--mono)}
.field-col{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field-col input{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);font:500 13px var(--mono);color:var(--ink)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font:600 16px var(--display)}
.io{display:grid;gap:8px;margin-top:10px}
.io textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px;font:400 11.5px/1.4 var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:8px}

.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.filebar input[type=text]{width:170px;max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font:600 13px var(--body);color:var(--ink)}
.board-wrap.dropping{outline:3px dashed var(--accent);outline-offset:-6px}

/* import dialog */
.dlg-back{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.dlg{width:min(680px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:0 18px 50px var(--shadow)}
.dlg h2{font:700 26px/1 var(--display);margin:0}
.dlg.wide{width:min(760px,100%)}
.dlg .dh{font:600 16px var(--display);margin:6px 0 -4px}
.dlg .grid2,.dlg .grid4{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.dlg .grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.dlg .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dlg .field-col input,.dlg .field-col select{width:100%}
.dlg ul.about{margin:0;padding-left:18px;display:grid;gap:4px}
.dlg .ver{margin:0;display:flex;gap:10px;align-items:baseline}
.dlg a{color:var(--accent)}
.gbody{display:grid;gap:6px;min-height:300px;align-content:start}
.gart{width:100%;max-width:340px;height:auto;justify-self:center;border-radius:10px;background:var(--panel-2)}
.gstep{margin:4px 0 0;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.gt{font:700 22px var(--display);margin:0}
.gbody p:last-child{margin:0;line-height:1.55}
.gnav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.gdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gdot{width:10px;height:10px;border-radius:50%;border:1px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.gdot.on{background:var(--accent);border-color:var(--accent)}
.dlg .row.end{justify-content:flex-end}
.dlg select,.dlg textarea{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink);font:500 13px var(--body);max-width:100%}
.dlg textarea{font:400 12px/1.4 var(--mono);width:100%;resize:vertical}
.dlg .field input{width:60px}
.dlg td b{display:block;font:600 12.5px var(--mono)}
.dlg td small{display:block;color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.dlg .issue{cursor:default}

/* routes */
#routeLayer{pointer-events:none}
.tr-under{fill:none;stroke:var(--rat-under);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.tr{fill:none;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.joint{stroke:var(--rat-under);stroke-width:1}
.jw-under{fill:none;stroke:var(--rat-under);stroke-width:8;stroke-linecap:round;opacity:.65}
.jw{fill:none;stroke-width:5;stroke-linecap:round}
.jend{fill:none;stroke-width:2.4}
.side.back{opacity:.32}
.side.back .jw,.side.back .tr{stroke-dasharray:6 5}
.rat.fail{stroke:var(--bad);stroke-dasharray:4 4;stroke-width:2.4}

/* solder plan */
.plan{display:grid;gap:12px;padding:0 16px 20px}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:15;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-14px 0 40px var(--shadow);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line);margin-bottom:12px}
.drawer-head h2{font:700 24px/1 var(--display);margin:0}
.sel{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font:500 13px var(--body);color:var(--ink)}
.plan-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.plan-head h2{font:700 24px/1 var(--display);margin:0}
.plan select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font:500 13px var(--body);color:var(--ink)}
.grp-title{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.grp-title h3{font:600 17px var(--display);margin:0}
.grp-title span{font-size:12px;color:var(--muted)}
ol.steps{margin:0;padding:0;list-style:none;display:grid;gap:4px;counter-reset:step}
ol.steps li{counter-increment:step}
ol.steps li.grp-title{counter-increment:none}
.step{display:grid;grid-template-columns:28px 20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;background:var(--panel-2);cursor:pointer}
.step::before{content:counter(step);font:600 12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.step input{width:17px;height:17px;accent-color:var(--ok);margin:0}
.step b{font:500 13px var(--mono);display:block;overflow-wrap:anywhere}
.step small{display:block;font-size:12px;color:var(--muted)}
.step:has(input:checked) b{text-decoration:line-through;color:var(--muted)}
.step:has(input:checked){opacity:.7}
.plan-empty{color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:500;max-width:calc(100% - 32px);transition:opacity .18s,transform .18s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<script>
(function(){
const PITCH=24, KEY='perfboard-planner-v1';
/* MARGIN = offset from the drawing's top-left to the first hole cell; it grows with the board's blank margin and the dimension lines */
let MARGIN=30, MARGIN_Y=30;
const MM=PITCH/2.54, PAD_R=6.2, PAD_R_MM=PAD_R/MM, LABEL=30;
/* default blank margin = the bare gap between the outer edges of two neighbouring hole pads */
const DEF_MARGIN_MM=Math.round((2.54-2*PAD_R_MM)*100)/100;
const SIDES=['t','r','b','l'], SIDE_NAME={t:'top',r:'right',b:'bottom',l:'left'};
/* per-side blank margins in mm, on the physical board (left/right as seen from the component side) */
function margins(){const m=state.board.margin,o={};for(const k of SIDES){const v=m&&typeof m==='object'?m[k]:m;o[k]=v===undefined||v===null||isNaN(+v)?DEF_MARGIN_MM:+v;}return o;}
function cleanMargin(m){const o={};for(const k of SIDES){const v=m&&typeof m==='object'?m[k]:m;o[k]=v===undefined||v===null||v===''||isNaN(+v)?DEF_MARGIN_MM:Math.round(clamp(+v,0,40)*100)/100;}return o;}
/* physical board size: hole span + pad rings + blank margin on every side */
function boardMM(){const m=margins(),{cols,rows}=state.board;return{w:(cols-1)*2.54+2*PAD_R_MM+m.l+m.r,h:(rows-1)*2.54+2*PAD_R_MM+m.t+m.b,m};}
const $=s=>document.querySelector(s);
const svg=$('#board'), boardLayer=$('#boardLayer'), partsLayer=$('#partsLayer'), ratsLayer=$('#ratsLayer'), overlayLayer=$('#overlayLayer'), routeLayer=$('#routeLayer');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/*ROUTER-START*/
const Router=(function(){
  /* Grid router for plated-through perfboard.
     Solder side: bare-wire runs between orthogonally adjacent holes (every hole on a run joins the net).
     Component side: straight insulated jumpers that hop over holes; ends land in free holes, never across a part.
     Strategy: negotiated congestion (nets may share holes while costs rise until they spread out), with jumpers
     priced high so detours win; then a sequential rip-up router as a fallback. Best = fewest unrouted pins,
     then fewest jumpers, then least wire.
     problem = {W,H, pinNet:Int32Array(-1 none, -2 unused lead, >=0 net), body:Uint8Array, nets:[{pins,power}], maxJump} */
  const DX=[1,0,-1,0], DY=[0,1,0,-1];
  const BEND=0.3, JBASE=20, JPER=0.5;
  function Heap(){this.k=[];this.v=[];}
  Heap.prototype.push=function(key,val){const k=this.k,v=this.v;let i=k.length;k.push(key);v.push(val);
    while(i>0){const p=(i-1)>>1;if(k[p]<=k[i])break;[k[p],k[i]]=[k[i],k[p]];[v[p],v[i]]=[v[i],v[p]];i=p;}};
  Heap.prototype.pop=function(){const k=this.k,v=this.v;const top=v[0];const lk=k.pop(),lv=v.pop();
    if(k.length){k[0]=lk;v[0]=lv;let i=0;const n=k.length;for(;;){const l=2*i+1,r=l+1;let m=i;
      if(l<n&&k[l]<k[m])m=l;if(r<n&&k[r]<k[m])m=r;if(m===i)break;[k[m],k[i]]=[k[i],k[m]];[v[m],v[i]]=[v[i],v[m]];i=m;}}
    return top;};
  Heap.prototype.size=function(){return this.k.length;};

  /* Route one net as a tree. ctx supplies costs and blocking.
     cellCost(c) -> extra multiplier info; blocked(c) -> bool; jumpOk/jumpCost for jumpers. */
  function routeNet(P,k,ctx,buf){
    const{W,H,pinNet,body}=P, maxJ=P.maxJump|0, net=P.nets[k];
    const{g,from,mv}=buf;
    const tree=new Set([net.pins[0]]); let remaining=net.pins.slice(1);
    const paths=[], failed=[];
    while(remaining.length){
      const targets=new Set(remaining), tx=remaining.map(c=>c%W), ty=remaining.map(c=>(c/W)|0);
      const h=c=>{const x=c%W,y=(c/W)|0;let m=1e9;for(let t=0;t<tx.length;t++){const d=Math.abs(x-tx[t])+Math.abs(y-ty[t]);if(d<m)m=d;}return m;};
      g.fill(Infinity); from.fill(-1);
      const heap=new Heap();
      for(const c of tree){const s=c*5+4;g[s]=0;mv[s]=0;heap.push(h(c),s);}
      let goal=-1;
      while(heap.size()){
        const s=heap.pop(), c=(s/5)|0, d=s%5, gc=g[s];
        if(gc>g[s])continue;
        if(targets.has(c)&&!tree.has(c)){goal=s;break;}
        const x=c%W,y=(c/W)|0;
        for(let dd=0;dd<4;dd++){
          const nx=x+DX[dd],ny=y+DY[dd]; if(nx<0||ny<0||nx>=W||ny>=H)continue;

/* Solder-side marking stencil.

        const bend=i===run.length||(i>=2&&((run[i].c-run[i-1].c)!==(run[i-1].c-run[i-2].c)||(run[i].r-run[i-1].r)!==(run[i-1].r-run[i-2].r)));

    svg+=`<g id="outline" fill="none" stroke="#000" stroke-width="0.2"><path d="M${mx(N)} 0 H${mx(W)} V${f(H)} H${mx(0)} V${f(N)} Z"/></g>\n`;

LIB.c3mini.castellated=true; LIB.xiaoc6.castellated=true;
const GROUPS=['Microcontrollers','Connectors','Headers','Passives','LEDs','Sound & switches','Modules'];
function getDef(p){
  if(LIB[p.type]&&LIB[p.type].spanable){
    const d0=LIB[p.type], s=p.span||d0.defSpan||4;
    return {...d0,w:s+1,h:1,pins:[{x:0,y:0,name:d0.pinNames[0],short:'',in:[0,0]},{x:s,y:0,name:d0.pinNames[1],short:'',in:[0,0]}]};
  }
  let d=LIB[p.type];
  if(p.mount==='smdon'&&d.castellated) d={...d,smdOn:true};
  if(p.mount==='smd'&&d.castellated){
    const w=d.w;
    d={...d,w:w+2,smd:true,pins:d.pins.map(q=>({...q,x:q.x===0?0:w+1}))};
  }
  if(p.type==='hdr'){const n=clamp(p.n||5,2,12);d={...LIB.hdr,...jst(n),name:`Pin header ${n}-pin`,short:`Header ${n}`,group:null};}
  if(p.labels&&(d.kind==='jst'||d.kind==='fhdr')) d={...d,pins:d.pins.map((q,i)=>p.labels[i]?{...q,name:`Pin ${i+1} · ${p.labels[i]}`}:q)};
  return d;
}

/* ---------- state ---------- */
const state={board:{cols:24,rows:18},parts:[],nets:[],seq:1,netSeq:1,sel:null,selNet:null,wireSrc:null,name:'',mode:'place',showRats:true,showRoutes:true,maxJump:8,routes:null,routeSig:'',
  flip:false,zoom:1,sample:false};
let undoStack=[], redoStack=[];

function seedSample(){
  state.board={cols:24,rows:18,margin:cleanMargin()}; state.seq=1; state.netSeq=1;
  const mk=(type,ref,x,y,rot,extra)=>Object.assign({id:'p'+(state.seq++),type,ref,x,y,rot,locked:false},extra||{});
  state.parts=[
    mk('c3mini','U1',0,5,3,{locked:true}),  // p1
    mk('jst3','J1',13,6,0),                 // p2  sensor: 3V3 / signal / GND
    mk('jst2','J2',20,2,0),                 // p3  5 V power in
    mk('res','R1',12,10,0,{span:4}),        // p4
    mk('led','D1',18,10,0),                 // p5
    mk('px5','PX1',14,13,0)                 // p6
  ];
  const net=(name,pins)=>{const ci=state.netSeq++;return{id:'n'+ci,ci,name,pins};};
  state.nets=[
    net('',['p1:8','p3:0','p6:1']),           // 5V
    net('',['p1:9','p3:1','p6:2','p5:1','p2:2']), // GND
    net('',['p1:10','p2:0']),                 // 3V3
    net('',['p1:11','p2:1']),                 // GPIO4 → sensor
    net('',['p1:13','p4:0']),                 // GPIO2 → R1
    net('LED1',['p4:1','p5:0']),              // R1 → LED anode
    net('',['p1:12','p6:0'])                  // GPIO3 → pixel DIN
  ];
  state.sample=true; state.sel=null; state.selNet=null; state.wireSrc=null;
}
function snapshot(){return JSON.stringify({board:state.board,parts:state.parts,nets:state.nets,seq:state.seq,netSeq:state.netSeq,maxJump:state.maxJump});}
function restore(s){const o=JSON.parse(s);state.board=o.board;state.parts=o.parts;state.nets=o.nets||[];state.seq=o.seq;state.netSeq=o.netSeq||1;if(o.maxJump!==undefined)state.maxJump=o.maxJump;}
function pushUndo(s){undoStack.push(s);if(undoStack.length>80)undoStack.shift();redoStack=[];state.sample=false;updateUndo();}
function updateUndo(){$('#undoBtn').disabled=!undoStack.length;$('#redoBtn').disabled=!redoStack.length;}
function afterHistory(){
  if(!find(state.sel))state.sel=null;
  if(!state.nets.some(n=>n.id===state.selNet))state.selNet=null;
  if(state.wireSrc&&!pinInfo(state.wireSrc))state.wireSrc=null;
  save();renderAll();updateUndo();
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push(snapshot()); restore(redoStack.pop()); afterHistory(); toast('Redone');
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
  if(!find(state.sel))state.sel=null;
  if(!state.nets.some(n=>n.id===state.selNet))state.selNet=null;
  if(state.wireSrc&&!pinInfo(state.wireSrc))state.wireSrc=null;
  save();renderAll();updateUndo();toast('Undone');
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({board:state.board,parts:state.parts,nets:state.nets,seq:state.seq,netSeq:state.netSeq,maxJump:state.maxJump,name:state.name}));}catch(e){}}
function projectObject(){
  return {app:'perfboard-planner',version:3,name:state.name||'Untitled board',savedAt:new Date().toISOString(),
    board:state.board,maxJump:state.maxJump,
    parts:state.parts.map(({id,type,ref,x,y,rot,locked,span,n,labels,from,mount,color})=>({id,type,ref,x,y,rot,locked,...(color?{color}:{}),...(span?{span}:{}),...(mount?{mount}:{}),...(n?{n}:{}),...(labels?{labels}:{}),...(from?{from}:{})})),
    nets:state.nets.map(n=>({name:n.name,pins:n.pins}))};
}
function applyProject(o,label){
  const b=cleanBoard(o&&o.board), ps=cleanParts(o&&o.parts);
  if(!b||!ps) return false;
  const snap=snapshot(); state.board=b; state.parts=ps; state.seq=Math.max(state.seq,ps.length+1);
  state.nets=cleanNets(o.nets,ps); state.netSeq=state.nets.length+1;
  if(o.maxJump!==undefined) state.maxJump=clamp(Math.round(+o.maxJump||0),0,16);
  state.name=String(o.name||'').slice(0,40);
  state.sel=null; state.selNet=null; state.wireSrc=null;
  pushUndo(snap); save(); renderAll();
  toast(`Opened ${label?label+': ':''}${ps.length} parts, ${state.nets.length} nets on a ${b.cols} × ${b.rows} board.`);
  return true;
}
function slug(s){return (s||'untitled-board').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'untitled-board';}
function cleanParts(arr){
  if(!Array.isArray(arr))return null;
  const out=[], ids=new Set();
  for(const p of arr){
    if(!p||!LIB[p.type])continue;
    let id=String(p.id||'').replace(/[^\w-]/g,'').slice(0,12);
    if(!id||ids.has(id)) id='p'+(state.seq++)+'x';
    ids.add(id);
    out.push({id,type:p.type,ref:String(p.ref||LIB[p.type].ref).replace(/[^\w-]/g,'').slice(0,8),
      x:Math.round(+p.x||0),y:Math.round(+p.y||0),rot:((Math.round(+p.rot||0)%4)+4)%4,locked:!!p.locked,
      ...(LIB[p.type].spanable?{span:clamp(Math.round(+p.span||LIB[p.type].defSpan||4),2,12)}:{}),
      ...(p.type==='hdr'?{n:clamp(Math.round(+p.n||5),2,12)}:{}),
      ...((p.mount==='smd'||p.mount==='smdon')&&LIB[p.type].castellated?{mount:p.mount}:{}),
      ...(Array.isArray(p.labels)?{labels:p.labels.slice(0,12).map(s=>String(s||'').replace(/[<>&"']/g,'').slice(0,12))}:{}),
      ...(p.from?{from:String(p.from).replace(/[<>&"']/g,'').slice(0,48)}:{}),
      ...(LIB[p.type].colorable&&LED_COLORS[p.color]?{color:p.color}:{})});
  }
  return out;
}
function cleanNets(arr,parts){
  if(!Array.isArray(arr))return [];
  const ok=new Set();
  for(const p of parts){const n=getDef(p).pins.length;for(let i=0;i<n;i++)ok.add(pk(p.id,i));}
  const used=new Set(), out=[];
  for(const n of arr){
    if(!n||!Array.isArray(n.pins))continue;
    const pins=[...new Set(n.pins.map(String))].filter(k=>ok.has(k)&&!used.has(k));
    if(pins.length<2)continue;
    pins.forEach(k=>used.add(k));
    const ci=out.length+1;
    out.push({id:'n'+ci,ci,name:String(n.name||'').slice(0,24),pins});
  }
  return out;
}
function cleanBoard(b){
  if(!b)return null;
  return {cols:clamp(Math.round(+b.cols||24),6,80),rows:clamp(Math.round(+b.rows||18),6,80),margin:cleanMargin(b.margin)};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw)return false;
    const o=JSON.parse(raw); const b=cleanBoard(o.board), ps=cleanParts(o.parts);
    if(!b||!ps)return false;
    state.board=b; state.parts=ps; state.seq=Math.max(+o.seq||1, ps.length+1);
    state.nets=cleanNets(o.nets,ps); state.netSeq=state.nets.length+1;
    if(o.maxJump!==undefined) state.maxJump=clamp(Math.round(+o.maxJump||0),0,16);
    state.name=String(o.name||'').slice(0,40);
    return true;
  }catch(e){return false;}
}

/* ---------- geometry ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rotPt(x,y,w,h,r){switch(r){case 1:return[h-1-y,x];case 2:return[w-1-x,h-1-y];case 3:return[y,w-1-x];default:return[x,y];}}
function rotDir(dx,dy,r){switch(r){case 1:return[-dy,dx];case 2:return[-dx,-dy];case 3:return[dy,-dx];default:return[dx,dy];}}
function geom(p){
  const d=getDef(p), r=p.rot||0, W=r%2?d.h:d.w, H=r%2?d.w:d.h;
  const pins=d.pins.map((q,i)=>{const[a,b]=rotPt(q.x,q.y,d.w,d.h,r);return{...q,i,c:p.x+a,r:p.y+b,dir:rotDir(q.in[0],q.in[1],r)};});
  return {d,W,H,x:p.x,y:p.y,pins,usb:d.usb?rotDir(0,-1,r):null};
}
function boxesTouch(a,b,m){return !(a.x+a.W+m<=b.x||b.x+b.W+m<=a.x||a.y+a.H+m<=b.y||b.y+b.H+m<=a.y);}
/* a part fits when every solder point lands on a hole; its body may overhang the board edge */
function inBoard(g){const{cols,rows}=state.board;return g.pins.every(q=>q.c>=0&&q.r>=0&&q.c<cols&&q.r<rows);}
function conflicts(){
  const out={}, gs=state.parts.map(p=>[p,geom(p)]);
  const add=(id,msg)=>{(out[id]=out[id]||[]).push(msg);};
  for(const[p,g]of gs) if(!inBoard(g)) add(p.id,'Off the board');
  for(let i=0;i<gs.length;i++)for(let j=i+1;j<gs.length;j++){
    if(boxesTouch(gs[i][1],gs[j][1],0)){add(gs[i][0].id,'Overlaps '+gs[j][0].ref);add(gs[j][0].id,'Overlaps '+gs[i][0].ref);}
  }
  return out;
}
function freeSpot(t,margin,ignoreId){
  const g=geom(t); if(!inBoard(g))return false;
  for(const q of state.parts){ if(q.id===ignoreId)continue; if(boxesTouch(g,geom(q),margin))return false; }
  return true;
}
function colName(c){let s='';c=c+1;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;}
function hole(c,r){return colName(c)+(r+1);}
function hx(c){const cc=state.flip?state.board.cols-1-c:c;return MARGIN+cc*PITCH+PITCH/2;}
function hy(r){return MARGIN_Y+r*PITCH+PITCH/2;}
function rectFor(x,y,W,H){
  const a=hx(x),b=hx(x+W-1); const x0=Math.min(a,b)-PITCH/2, x1=Math.max(a,b)+PITCH/2;
  return {x:x0,y:hy(y)-PITCH/2,w:x1-x0,h:H*PITCH};
}
function dispPt(p,g,lx,ly){const[a,b]=rotPt(lx,ly,g.d.w,g.d.h,p.rot||0);return[hx(p.x+a),hy(p.y+b)];}
function find(id){return state.parts.find(p=>p.id===id);}
function nextRef(prefix){
  let n=0; const re=new RegExp('^'+prefix+'(\\d+)$');
  for(const p of state.parts){const m=re.exec(p.ref);if(m)n=Math.max(n,+m[1]);}
  return prefix+(n+1);
}
function mm(n){return (n*2.54).toFixed(1);}

/* ---------- nets ---------- */
function pk(pid,i){return pid+':'+i;}
function parseKey(k){const j=k.lastIndexOf(':');return{pid:k.slice(0,j),i:+k.slice(j+1)};}
function pinInfo(k){

function netIssues(n){

  for(const arr of Object.values(byPart)){

    inT[u]=true; if(from[u]>=0)edges.push([from[u],u,d[u]]);
    for(let v=0;v<n;v++) if(!inT[v]){const w=Math.abs(pts[u].q.c-pts[v].q.c)+Math.abs(pts[u].q.r-pts[v].q.r); if(w<d[v]){d[v]=w;from[v]=u;}}

  else if(na&&!nb){na.pins.push(b);n=na;}
  else if(!na&&nb){nb.pins.push(a);n=nb;}
  else{
    const keep=na.name?na:(nb.name?nb:(na.pins.length>=nb.pins.length?na:nb)), other=keep===na?nb:na;
    keep.pins.push(...other.pins); state.nets=state.nets.filter(x=>x!==other); n=keep;

function deleteNet(id){

function pruneNets(pid){

  state.nets=state.nets.filter(n=>n.pins.length>=2);

function allIssues(cf){
  const list=[];

  for(const n of state.nets) for(const i of netIssues(n)) list.push({sev:i.sev,msg:`${netName(n)}: ${i.msg}`,net:n.id});
  return list;
}

/* ---------- routing ---------- */
function routeSigNB(){return JSON.stringify([state.parts.map(p=>[p.id,p.type,p.x,p.y,p.rot,p.span||0,p.mount||'']),state.nets.map(n=>n.pins),state.maxJump]);}
function rW(){return (state.routes&&state.routes.W)||state.board.cols;}
function routeSig(){return JSON.stringify([state.board,state.parts.map(p=>[p.id,p.type,p.x,p.y,p.rot,p.span||0,p.mount||'']),state.nets.map(n=>n.pins),state.maxJump]);}
function buildProblem(){
  const W=state.board.cols, H=state.board.rows, N=W*H, body=new Uint8Array(N), pinNet=new Int32Array(N).fill(-1);
  const netIdx={}; state.nets.forEach((n,k)=>n.pins.forEach(key=>{netIdx[key]=k;}));
  for(const p of state.parts){
    const g=geom(p);
    for(let y=Math.max(0,g.y);y<Math.min(H,g.y+g.H);y++)for(let x=Math.max(0,g.x);x<Math.min(W,g.x+g.W);x++)body[y*W+x]=1;
    for(const q of g.pins){const k=netIdx[pk(p.id,q.i)];pinNet[q.r*W+q.c]=k===undefined?-2:k;}
  }
  const nets=state.nets.map(n=>({pins:n.pins.map(k=>{const pi=pinInfo(k);return pi.q.r*W+pi.q.c;}),power:netPowers(n).length?1:0}));

}
function ensureRoutes(cf){
  if(drag)return;
  const sig=routeSig(); if(sig===state.routeSig)return;
  if(Object.keys(cf).length){state.routeSig=sig;state.routes={paused:true};return;}
  const nb=routeSigNB(), R=state.routes;
  if(nb===state.routeSigNB&&R&&!R.paused&&!R.empty){ // only the board size changed: keep the wires if they still fit
    const{cols,rows}=state.board, W=R.W||cols;
    const fits=R.res.every(r=>r.paths.every(p=>p.every(s=>s.c%W<cols&&((s.c/W)|0)<rows)));
    if(fits){state.routeSig=sig;return;}
  }
  state.routeSig=sig; state.routeSigNB=nb;
  if(!state.nets.length){state.routes={res:[],jumps:0,len:0,failed:0,empty:true};return;}
  state.routes=Router.route(buildProblem(),700);

function routesOk(){const R=state.routes;return !!(R&&!R.paused);}
function manh(a,b){const W=rW();return Math.abs(a%W-b%W)+Math.abs(((a/W)|0)-((b/W)|0));}
function cellHole(c){const W=rW();return hole(c%W,(c/W)|0);}
function pathPieces(path){

    const b=path[i].c;

    else poly.push(b);

}
function renderRoutes(){
  const R=state.routes;
  if(!state.showRoutes||!routesOk()||R.empty||(drag&&drag.moved)){routeLayer.innerHTML='';return;}
  const W=rW(), X=c=>hx(c%W), Y=c=>hy((c/W)|0);
  const srcNet=state.wireSrc?netOf(state.wireSrc):null, focus=state.selNet||(srcNet&&srcNet.id)||null;
  let tr='',jw='';
  state.nets.forEach((n,k)=>{
    const rr=R.res[k]; if(!rr)return;
    const col=netColor(n), edge=netEdge(n), op=focus&&focus!==n.id?.15:1;
    for(const path of rr.paths){
      const{runs,jumps}=pathPieces(path);
      for(const run of runs){
        const pts=run.map(c=>X(c)+','+Y(c)).join(' ');
        tr+=`<polyline class="tr-under" style="opacity:${.6*op}${edge?';stroke:'+edge:''}" points="${pts}"/><polyline class="tr" style="stroke:${col};opacity:${op}" points="${pts}"/>`;
        for(const c of run) tr+=`<circle class="joint" style="fill:${col};opacity:${op}${edge?';stroke:'+edge:''}" cx="${X(c)}" cy="${Y(c)}" r="3.3"/>`;
      }
      for(const[a,b]of jumps){
        const x1=X(a),y1=Y(a),x2=X(b),y2=Y(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,mx=(x1+x2)/2-dy/L*9,my=(y1+y2)/2+dx/L*9;
        const d=`M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`;
        jw+=`<path class="jw-under" style="opacity:${.65*op}${edge?';stroke:'+edge:''}" d="${d}"/><path class="jw" style="stroke:${col};opacity:${op}" d="${d}"/>`+
            `<circle class="jend" style="stroke:${col};opacity:${op}" cx="${x1}" cy="${y1}" r="5.6"/><circle class="jend" style="stroke:${col};opacity:${op}" cx="${x2}" cy="${y2}" r="5.6"/>`;
      }

const HEIGHT={smdled:1,dht:5,res:1,led:2,fhdr:3,btn:3,sw:3,px5:4,jst:4,buzzer:5,pxmod:5,module:6,mic:6,mcu:7};
function planData(){
  const R=state.routes;
  const groups=[
    {title:'Jumpers',hint:'Component side · insulated wire, fit these first while the board lies flat',items:[]},
    {title:'Parts',hint:'Component side · lowest first',items:[]},
    {title:'Wire runs',hint:'Solder side · bare tinned wire or solder bridges, power nets first',items:[]}
  ];
  state.nets.forEach((n,k)=>{const rr=R.res[k]; if(!rr)return;
    rr.paths.forEach(path=>pathPieces(path).jumps.forEach(([a,b])=>{const L=manh(a,b);
      groups[0].items.push({net:n,text:`${cellHole(a)} → ${cellHole(b)}`,sub:`${netName(n)} · ${L} holes · ${mm(L)} mm insulated wire`});}));});
  [...state.parts].sort((a,b)=>(HEIGHT[getDef(a).kind]-HEIGHT[getDef(b).kind])||a.ref.localeCompare(b.ref)).forEach(p=>{
    const g=geom(p); let sub;
    if(g.d.kind==='mcu'){const u=usbInfo(p,g);sub=`pin 1 (${pinShort(g.pins[0])}) in ${hole(g.pins[0].c,g.pins[0].r)} · USB toward the ${u.side} edge`;}
    else sub=g.pins.map(q=>`${q.short||pinShort(q)} ${hole(q.c,q.r)}`).join(' · ');
    groups[1].items.push({text:`${p.ref} · ${g.d.name}`,sub});
  });
  const rank=n=>{const pw=netPowers(n);return pw.includes('GND')?0:pw.includes('5V')?1:pw.includes('3V3')?2:3;};
  state.nets.map((n,k)=>[n,k]).sort((a,b)=>rank(a[0])-rank(b[0])).forEach(([n,k])=>{const rr=R.res[k]; if(!rr)return;
    rr.paths.forEach(path=>pathPieces(path).runs.forEach(run=>{
      const wp=[run[0]];
      for(let i=1;i<run.length-1;i++){if(run[i]-run[i-1]!==run[i+1]-run[i])wp.push(run[i]);}
      wp.push(run[run.length-1]);
      const L=run.length-1, bends=wp.length-2;
      groups[2].items.push({net:n,text:L===1?`Bridge ${cellHole(run[0])}–${cellHole(run[1])}`:`Wire ${wp.map(cellHole).join(' → ')}`,
        sub:`${netName(n)} · ${L} hole${L>1?'s':''}${bends?` · ${bends} bend${bends>1?'s':''}`:''}`});
    }));});
  return groups;
}
const PROG_KEY='perfboard-planner-progress';
function sigHash(){let h=5381;const s=routeSigNB();for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h);}
let progMem={sig:'',done:[]};
function loadProgress(){
  let o=progMem;
  try{const raw=localStorage.getItem(PROG_KEY); if(raw)o=JSON.parse(raw);}catch(e){}
  return new Set(o&&o.sig===sigHash()?o.done:[]);
}
function saveProgress(set){progMem={sig:sigHash(),done:[...set]};try{localStorage.setItem(PROG_KEY,JSON.stringify(progMem));}catch(e){}}
function stepId(gi,it){return gi+':'+it.text+':'+(it.net?it.net.id:'');}
function failText(){
  const R=state.routes, out=[];
  state.nets.forEach((n,k)=>{const rr=R.res[k]; if(!rr||!rr.failed.length)return;
    const W=rW(); const names=rr.failed.map(c=>{const pi=pinAtCell({c:c%W,r:(c/W)|0});return pi?pinLabel(pi):cellHole(c);});

function renderPlan(){
  const el=$('#plan'), R=state.routes;
  const head=stats=>`<div class="plan-head"><div>${stats||''}</div><div class="row">
      <button class="btn" type="button" id="copyPlan"${routesOk()&&!R.empty?'':' disabled'}>Copy as text</button>
      <button class="btn" type="button" id="savePlan"${routesOk()&&!R.empty?'':' disabled'}>Save .txt</button>
      <button class="btn" type="button" id="stencilStl"${routesOk()&&!R.empty?'':' disabled'} title="3D-printable solder-side marking stencil">Stencil .stl</button>
      <button class="btn" type="button" id="stencilSvg"${routesOk()&&!R.empty?'':' disabled'} title="1:1 solder-side stencil drawing in mm">Stencil .svg</button></div></div>`;
  if(!R||R.paused){el.innerHTML=head()+`<p class="plan-empty">Routing is paused while parts overlap or sit off the board. Fix the parts marked in red and the plan comes back.</p>`;return;}
  if(R.empty){el.innerHTML=head()+`<p class="plan-empty">No nets yet. Switch to Wire and connect some pins; the router lays out the wires as soon as you do.</p>`;return;}
  const groups=planData(), done=loadProgress(); let total=0,dn=0, html='<ol class="steps">';
  groups.forEach((g,gi)=>{ if(!g.items.length)return;
    html+=`<li class="grp-title"><div class="grp-title"><h3>${g.title}</h3><span>${g.hint}</span></div></li>`;
    g.items.forEach(it=>{const id=stepId(gi,it), on=done.has(id); total++; if(on)dn++;
      html+=`<li><label class="step"><input type="checkbox" data-step="${esc(id)}"${on?' checked':''}><span><b>${esc(it.text)}</b><small>${esc(it.sub)}</small></span>${it.net?netBadge(it.net):'<span></span>'}</label></li>`;});
  });
  html+='</ol>';
  const routed=R.res.filter(x=>!x.failed.length).length;
  const stats=`<p class="sub">${routed} of ${state.nets.length} nets routed · ${R.jumps} jumper${R.jumps===1?'':'s'} · ${R.len} holes of solder-side wire · ${dn} of ${total} steps done</p>`;
  const fails=failText();
  const failHtml=fails.length?`<div class="plist">${fails.map(f=>`<button class="issue" type="button" data-net="${f.net.id}">${esc(f.msg)}. Move parts to open a gap${state.maxJump===0?' or allow jumpers':state.maxJump<12?' or allow longer jumpers':''}.</button>`).join('')}</div>`:'';
  el.innerHTML=head(stats)+`<p class="note">Double-sided perfboard has plated holes, so each hole belongs to one net on both sides. Where two nets must cross, the plan uses an insulated jumper on the component side.</p>`+failHtml+html;

function planText(){
  const groups=planData(); let n=1;

  for(const g of groups){ if(!g.items.length)continue; lines.push(`${g.title.toUpperCase()} (${g.hint})`);
    for(const it of g.items) lines.push(`${n++}. ${it.text} — ${it.sub}`); lines.push(''); }

}
function setZoom(z,anchor){

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

function suggest(p,target){
  const{cols,rows}=state.board;
  if(LIB[p.type].kind==='mcu'&&!target){
    const t={...p,rot:3}; const g=geom(t); t.x=0; t.y=Math.floor((rows-g.H)/2);
    if(freeSpot(t,0,p.id)) return {x:t.x,y:t.y,rot:3};
  }
  const anchor=state.parts.find(q=>LIB[q.type].kind==='mcu');
  let ac=[cols/2,rows/2]; if(anchor){const ag=geom(anchor);ac=[ag.x+ag.W/2,ag.y+ag.H/2];}
  if(target) ac=target;
  for(const m of [1,0]){
    let best=null;
    for(const rot of [0,1]) for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
      const t={...p,x,y,rot}; if(!freeSpot(t,m,p.id))continue;
      const g=geom(t), dd=Math.hypot(x+g.W/2-ac[0],y+g.H/2-ac[1])+rot*.5;
      if(!best||dd<best.dd) best={x,y,rot,dd};
    }
    if(best) return {x:best.x,y:best.y,rot:best.rot};
  }
  return null;
}
function addPart(type){
  const snap=snapshot();

  if(LIB[type].spanable)p.span=LIB[type].defSpan||4;
  const spot=suggest(p);
  if(!spot){state.seq--;toast('No free spot fits this part. Make the board bigger or move parts.');return;}
  Object.assign(p,spot); state.parts.push(p); pushUndo(snap);
  if(state.mode==='wire'){state.mode='place';state.wireSrc=null;}
  state.sel=p.id; state.selNet=null; save(); renderAll();
  const g=geom(p);
  toast(LIB[type].kind==='mcu'?`Placed ${p.ref} on the left edge, USB facing out. Lock it once it sits right.`:`Added ${p.ref} near the microcontroller, pin 1 at ${hole(g.pins[0].c,g.pins[0].r)}.`);

function tryChange(p,mutate,failMsg){

}

}

function setSpan(p,delta){

function setMount(p,to){

  pushUndo(snap); save(); renderAll();
  const iss=conflicts()[p.id];
  if(iss) toast(`${p.ref}: ${MOUNTS[to]}, but its solder points now ${iss[0]==='Off the board'?'fall off the board':iss[0].toLowerCase()}. Move it or the other part to clear the red outline.`);
  else toast({'':`${p.ref} is on through-hole pins.`,smdon:`${p.ref} lies flat with each castellated pad right over a hole; solder pad and hole together.`,smd:`${p.ref} lies flat; each castellated pad bridges to the hole just outside the module.`}[to]);
}
function deletePart(p){
  const snap=snapshot(); state.parts=state.parts.filter(q=>q.id!==p.id); pruneNets(p.id); state.sel=null;
  pushUndo(snap); save(); renderAll(); toast(`Removed ${p.ref} and its connections. Undo brings them back.`);
}
function toggleLock(p){const snap=snapshot();p.locked=!p.locked;pushUndo(snap);save();renderAll();toast(p.locked?`${p.ref} locked in place.`:`${p.ref} unlocked.`);}

/* ---------- pointer handling ---------- */
function svgPt(e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const m=svg.getScreenCTM(); if(!m)return null; return pt.matrixTransform(m.inverse());
}
function cellAt(e){
  const q=svgPt(e); if(!q)return{c:-1,r:-1};
  let c=Math.floor((q.x-MARGIN)/PITCH); const r=Math.floor((q.y-MARGIN_Y)/PITCH);
  if(state.flip)c=state.board.cols-1-c;
  return{c,r};
}
function pinAtCell(cell){
  for(const p of state.parts){const g=geom(p);const q=g.pins.find(q=>q.c===cell.c&&q.r===cell.r);if(q)return{p,q,g,key:pk(p.id,q.i)};}
  return null;
}
function describeCell(c,r){
  const{cols,rows}=state.board;
  if(c<0||r<0||c>=cols||r>=rows) return 'Outside the board';
  const s='Hole '+hole(c,r);
  const pi=pinAtCell({c,r});
  if(pi){const n=netOf(pi.key);return `${s} · ${pi.p.ref} ${pi.q.name}${n?' · net '+netName(n):''}`;}
  for(const p of state.parts){const g=geom(p); if(c>=g.x&&c<g.x+g.W&&r>=g.y&&r<g.y+g.H) return `${s} · under ${p.ref}`;}
  return s+' · free';
}
function wireTap(cell){
  const pi=pinAtCell(cell);
  if(!pi){
    if(state.wireSrc){state.wireSrc=null;overlayLayer.innerHTML='';}
    else state.selNet=null;
    refresh(); return;
  }
  if(!state.wireSrc){
    state.wireSrc=pi.key; const n=netOf(pi.key); state.selNet=n?n.id:null; refresh(); return;
  }
  if(state.wireSrc===pi.key){state.wireSrc=null;overlayLayer.innerHTML='';refresh();return;}
  const a=pinInfo(state.wireSrc);
  const already=netOf(state.wireSrc)&&netOf(state.wireSrc)===netOf(pi.key);
  const n=connect(state.wireSrc,pi.key);
  state.selNet=n.id; state.wireSrc=pi.key;
  if(!already){
    const iss=netIssues(n);
    toast(iss.length?`Connected, but check it — ${iss[0].msg}.`:`${pinLabel(a)} → ${pinLabel(pi)} on ${netName(n)}`);
  }
  refresh();
}
let drag=null;
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const cell=cellAt(e);
  $('#status').textContent=describeCell(cell.c,cell.r);
  if(state.mode==='wire'){ e.preventDefault(); wireTap(cell); return; }
  const gEl=e.target.closest('.part');
  if(!gEl){ if(state.sel||state.selNet){state.sel=null;state.selNet=null;refresh();} return; }
  const p=find(gEl.dataset.id); if(!p)return;
  if(state.sel!==p.id) select(p.id);
  drag={id:p.id,start:cell,ox:p.x,oy:p.y,snap:snapshot(),moved:false,locked:p.locked,warned:false};
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
svg.addEventListener('pointermove',e=>{
  const cell=cellAt(e);
  if(state.mode==='wire'){
    if(e.pointerType==='mouse') $('#status').textContent=describeCell(cell.c,cell.r);
    const src=pinInfo(state.wireSrc); const q=svgPt(e);
    if(src&&q&&e.pointerType==='mouse'){
      const tgt=pinAtCell(cell); const x2=tgt?hx(tgt.q.c):q.x, y2=tgt?hy(tgt.q.r):q.y;
      overlayLayer.innerHTML=`<line class="band" x1="${hx(src.q.c)}" y1="${hy(src.q.r)}" x2="${x2}" y2="${y2}"/>`;
    }
    return;
  }
  if(!drag){ if(e.pointerType==='mouse') $('#status').textContent=describeCell(cell.c,cell.r); return; }
  const p=find(drag.id); if(!p)return;
  const dx=cell.c-drag.start.c, dy=cell.r-drag.start.r;
  if(drag.locked){ if((dx||dy)&&!drag.warned){drag.warned=true;toast(`${p.ref} is locked. Unlock it to move.`);} return; }
  if(p.x!==drag.ox+dx||p.y!==drag.oy+dy){
    p.x=drag.ox+dx; p.y=drag.oy+dy; drag.moved=true; renderParts();
    const g=geom(p); $('#status').textContent=`${p.ref} pin 1 → ${inBoard(g)?hole(g.pins[0].c,g.pins[0].r):'off the board'}`;
  }
});
function endDrag(){
  if(!drag)return; const p=find(drag.id); const d=drag; drag=null;
  if(!p||!d.moved)return;
  if(p.x===d.ox&&p.y===d.oy){renderAll();return;}
  const iss=conflicts()[p.id];
  if(iss){p.x=d.ox;p.y=d.oy;renderAll();toast(`${iss[0]==='Off the board'?'That spot is off the board':'That spot '+iss[0].toLowerCase()}. ${p.ref} went back.`);return;}
  pushUndo(d.snap); save(); renderAll();
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('pointerleave',()=>{if(!drag){$('#status').textContent='Hover or tap a hole to see its coordinate.';overlayLayer.innerHTML='';}});

function modal(o){
  return new Promise(res=>{
    const back=document.createElement('div'); back.className='dlg-back'; back.dataset.modal='1';
    back.innerHTML=`<div class="dlg${o.wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="mdlT"><h2 id="mdlT">${o.title}</h2>${o.body||''}
      <div class="row end">${(o.buttons||[]).map((b,i)=>`<button class="btn ${b.kind||''}" type="button" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
    document.body.appendChild(back);
    const done=v=>{back.remove();document.removeEventListener('keydown',key,true);res(v);};
    const key=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();done(null);}};
    document.addEventListener('keydown',key,true);
    back.addEventListener('click',async e=>{
      if(e.target===back){done(null);return;}
      const b=e.target.closest('[data-i]'); if(!b)return;
      const def=o.buttons[+b.dataset.i];
      if(def.check){const ok=await def.check(back);if(!ok)return;}
      done(def.value);
    });
    if(o.init)o.init(back);
    const f=back.querySelector('.btn.primary')||back.querySelector('.btn'); if(f&&!o.noFocus)f.focus();
  });
}

  const nbad=Object.keys(conflicts()).length, R=state.routes;

}

/* ---------- component organizer ---------- */
/* Places every unlocked part to make the board easy to route: a greedy first placement by connectivity,
   then simulated annealing on wire length (Manhattan spanning trees), crossings between nets and crowding,
   then real routing of the candidates. Locked parts never move; a microcontroller keeps its USB at an edge. */
function orgScore(R){return R?R.failed*1e6+R.jumps*1e3+R.len:Infinity;}
function organizeLayout(seed){
  const{cols,rows}=state.board, rnd=(s=>()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;})(seed);
  const fixed=state.parts.filter(p=>p.locked), mov=state.parts.filter(p=>!p.locked);
  const nets=state.nets.map(n=>n.pins.map(parseKey));
  const G={}; for(const p of state.parts)G[p.id]=geom(p);
  const isMcu=p=>LIB[p.type].kind==='mcu'&&LIB[p.type].usb;
  const placed=new Set(fixed.map(p=>p.id));
  const feasible=(p,ignore,margin)=>{
    const g=geom(p); if(!inBoard(g))return false;
    if(isMcu(p)&&usbInfo(p,g).dist>0)return false;
    for(const q of state.parts){ if(q.id===p.id||q.id===ignore||!placed.has(q.id))continue; if(boxesTouch(g,G[q.id],margin))return false; }
    return true;
  };
  const pinXY=(pid,i)=>{const q=G[pid].pins[i];return q?[q.c,q.r]:null;};
  // greedy: most-connected-to-placed first
  const links=p=>nets.reduce((a,n)=>a+(n.some(k=>k.pid===p.id)?n.filter(k=>k.pid!==p.id&&placed.has(k.pid)).length:0),0);
  const todo=[...mov].sort((a,b)=>(isMcu(b)-isMcu(a)));
  while(todo.length){
    todo.sort((a,b)=>(isMcu(b)-isMcu(a))||(links(b)-links(a))||(rnd()-.5));
    const p=todo.shift(); let best=null;
    for(const m of [1,0]){
      for(let rot=0;rot<4;rot++)for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
        p.x=x;p.y=y;p.rot=rot; if(!feasible(p,null,m))continue;
        const g=geom(p); let c=0, any=false;
        for(const n of nets){ const mine=n.filter(k=>k.pid===p.id); if(!mine.length)continue;
          const others=n.filter(k=>k.pid!==p.id&&placed.has(k.pid)).map(k=>pinXY(k.pid,k.i)).filter(Boolean);
          for(const k of mine){const q=g.pins[k.i]; if(!q)continue; let d=1e9; for(const o of others)d=Math.min(d,Math.abs(o[0]-q.c)+Math.abs(o[1]-q.r)); if(d<1e9){c+=d;any=true;}}
        }
        if(!any) c=Math.abs(x+g.W/2-cols/2)+Math.abs(y+g.H/2-rows/2);
        c+=rnd()*.3;
        if(!best||c<best.c)best={c,x,y,rot};
      }
      if(best)break;
    }
    if(!best)return null;
    p.x=best.x;p.y=best.y;p.rot=best.rot; G[p.id]=geom(p); placed.add(p.id);
  }
  // annealing
  const segs=()=>{const out=[];nets.forEach((n,ni)=>{const pts=n.map(k=>pinXY(k.pid,k.i)).filter(Boolean);
    const m=pts.length; if(m<2)return; const inT=new Array(m).fill(false), d=new Array(m).fill(Infinity), fr=new Array(m).fill(-1); d[0]=0;
    for(let it=0;it<m;it++){let u=-1;for(let i=0;i<m;i++)if(!inT[i]&&(u<0||d[i]<d[u]))u=i;inT[u]=true;if(fr[u]>=0)out.push([ni,pts[fr[u]],pts[u]]);
      for(let v=0;v<m;v++)if(!inT[v]){const w=Math.abs(pts[u][0]-pts[v][0])+Math.abs(pts[u][1]-pts[v][1]);if(w<d[v]){d[v]=w;fr[v]=u;}}}});return out;};
  const ori=(a,b,c)=>Math.sign((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]));
  const cross=(s1,s2)=>{const[a,b]=[s1[1],s1[2]],[c,d]=[s2[1],s2[2]];return ori(a,b,c)*ori(a,b,d)<0&&ori(c,d,a)*ori(c,d,b)<0;};
  const cost=()=>{const S=segs(); let len=0,x=0; for(const s of S)len+=Math.abs(s[1][0]-s[2][0])+Math.abs(s[1][1]-s[2][1]);
    for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++)if(S[i][0]!==S[j][0]&&cross(S[i],S[j]))x++;
    let crowd=0; const ps=state.parts; for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)if(boxesTouch(G[ps[i].id],G[ps[j].id],1))crowd++;
    return len+8*x+1.5*crowd;};
  let cur=cost(), t0=Date.now(), T=6;
  const iters=2500;
  for(let it=0;it<iters&&Date.now()-t0<900;it++){
    T=6*Math.pow(0.05/6,it/iters);
    const p=mov[Math.floor(rnd()*mov.length)], old={x:p.x,y:p.y,rot:p.rot}, r=rnd(); let q=null, oldq=null;
    if(r<.6){p.x+=Math.round((rnd()-.5)*6);p.y+=Math.round((rnd()-.5)*6);}
    else if(r<.8){p.rot=(p.rot+1+Math.floor(rnd()*3))%4;}
    else if(mov.length>1){q=mov[Math.floor(rnd()*mov.length)]; if(q===p){q=null;continue;} oldq={x:q.x,y:q.y,rot:q.rot};
      const gp=G[p.id],gq=G[q.id]; p.x=Math.round(gq.x+gq.W/2-gp.W/2); p.y=Math.round(gq.y+gq.H/2-gp.H/2); q.x=Math.round(gp.x+gp.W/2-gq.W/2); q.y=Math.round(gp.y+gp.H/2-gq.H/2);}
    G[p.id]=geom(p); if(q)G[q.id]=geom(q);
    let ok=feasible(p,q&&q.id,0)&&(!q||feasible(q,p.id,0));
    if(q&&ok&&boxesTouch(G[p.id],G[q.id],0))ok=false;
    let nc=ok?cost():Infinity;
    if(ok&&(nc<=cur||rnd()<Math.exp((cur-nc)/T))){cur=nc;}
    else{Object.assign(p,old);G[p.id]=geom(p); if(q){Object.assign(q,oldq);G[q.id]=geom(q);}}
  }
  return mov.map(p=>({id:p.id,x:p.x,y:p.y,rot:p.rot}));
}
function organize(){
  const mov=state.parts.filter(p=>!p.locked);
  if(!mov.length){toast('Every part is locked. Unlock the parts you want the organizer to move.');return;}
  if(!state.nets.length){toast('Connect some pins first. The organizer places parts by how they’re wired.');return;}
  $('#organizeBtn').disabled=true; toast('Organizing parts…');
  setTimeout(()=>{
    const snap=snapshot(), orig=state.parts.map(p=>({id:p.id,x:p.x,y:p.y,rot:p.rot}));
    const restore=pos=>{for(const o of pos){const p=find(o.id);if(p){p.x=o.x;p.y=o.y;p.rot=o.rot;}}};
    const cf0=conflicts(); let base=null;
    if(!Object.keys(cf0).length){ base=Router.route(buildProblem(),500); }
    let best=null;
    for(const seed of [11,23,47]){
      restore(orig);
      const pos=organizeLayout(seed); if(!pos)continue;
      if(Object.keys(conflicts()).length)continue;
      const R=Router.route(buildProblem(),500);
      if(!best||orgScore(R)<orgScore(best.R))best={pos,R};
      if(best.R.failed===0&&best.R.jumps===0)break;
    }
    restore(orig); $('#organizeBtn').disabled=false;
    if(!best){toast('No layout fits on this board. Make the board bigger or unlock more parts.');renderAll();return;}
    if(base&&orgScore(best.R)>=orgScore(base)){renderAll();toast(`Your layout is already as good as the organizer found (${base.jumps} jumper${base.jumps===1?'':'s'}, ${base.len} holes of wire). Nothing moved.`);return;}
    restore(best.pos); pushUndo(snap); state.sel=null; state.selNet=null; save(); renderAll();
    const R=state.routes;
    toast(`Organized ${mov.length} part${mov.length>1?'s':''}: ${R.jumps} jumper${R.jumps===1?'':'s'}, ${R.len} holes of wire${base?` (was ${base.jumps} and ${base.len})`:''}${R.failed?`, ${R.failed} pin${R.failed>1?'s':''} unrouted`:''}. Undo puts them back.`);
  },40);
}

async function saveFile(filename,data,what){
  if(!window.claude){ // running on its own (GitHub Pages, local file): use a normal browser download
    try{
      const ext=filename.split('.').pop(), url=URL.createObjectURL(new Blob([data],{type:{json:'application/json',svg:'image/svg+xml',stl:'model/stl',zip:'application/zip'}[ext]||'text/plain'}));
      const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000); toast(`Saved ${filename}.`); return true;
    }catch(_){}
  }
  if(!downloads){
    const t=$('#ioText'), d=$('#ioBox');
    if(t){t.value=data; if(d)d.open=true; t.focus(); t.select();}
    toast(`Saving files isn’t available in this view. The ${what} is in the Save & load box to copy instead.`);
    return false;
  }
  try{ await downloads.save({filename,data}); toast(`Saved ${filename}.`); return true; }
  catch(err){
    const c=err&&err.code;
    if(c==='declined') return false;
    if(c==='rate_limited'){toast('A save prompt is already open.');return false;}
    toast(`Couldn’t save the file (${c||'unavailable'}). Use Copy layout under Save & load instead.`);
    return false;
  }
}

function srcCanon(type,pin){
  const u=String(pin).replace(/\.\d+$/,'').trim().toUpperCase(), t=String(type).toLowerCase(), chip=chipOf(t);
  if(/^GND/.test(u))return 'GND';

function closeImport(){imp=null;const d=$('#impBack');if(d)d.remove();}
function applyImport(){

  const mcu=a.parts.find(p=>LIB[p.type].kind==='mcu'), others=a.parts.filter(p=>p!==mcu);

    state.board={cols,rows,margin:margins()}; state.parts=[]; let ok=true;
    if(mcu){const s=suggest(mcu); if(!s){ok=false;} else {Object.assign(mcu,s);state.parts.push(mcu);}}
    if(ok){

      const xs=others.map(p=>p.wx), ys=others.map(p=>p.wy), mnx=Math.min(...xs,0), mxx=Math.max(...xs,1), mny=Math.min(...ys,0), mxy=Math.max(...ys,1);

function stencilData(){

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

/* pan: drag with the right (or middle) mouse button; the wheel zooms around the pointer */
(function(){
  const wrap=$('#boardWrap'); let pan=null;
  wrap.addEventListener('contextmenu',e=>e.preventDefault());
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||(e.button!==2&&e.button!==1))return;
    e.preventDefault(); e.stopPropagation();
    pan={x:e.clientX,y:e.clientY,l:wrap.scrollLeft,t:wrap.scrollTop,id:e.pointerId};
    try{wrap.setPointerCapture(e.pointerId);}catch(_){}
    wrap.classList.add('panning');
  },true);
  wrap.addEventListener('pointermove',e=>{ if(!pan)return; wrap.scrollLeft=pan.l-(e.clientX-pan.x); wrap.scrollTop=pan.t-(e.clientY-pan.y); });
  const end=()=>{ if(!pan)return; pan=null; wrap.classList.remove('panning'); };
  wrap.addEventListener('pointerup',end); wrap.addEventListener('pointercancel',end);
  /* mouse wheel zooms in and out around the pointer (trackpad pinch arrives as ctrl+wheel and works the same) */
  wrap.addEventListener('wheel',e=>{ e.preventDefault();
    const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;
    setZoom(state.zoom*Math.exp(-clamp(dy,-120,120)*(e.ctrlKey?0.01:0.0018)),{cx:e.clientX,cy:e.clientY}); },{passive:false});

  if(e.key==='s'||e.key==='S'){state.flip=!state.flip;renderAll();toast(state.flip?'Solder side (S for component side)':'Component side (S for solder side)');return;}

});
